<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="بله">
  <!--
    نشان پیام‌رسان بله: یک حباب گفت‌وگو با گوشه‌ی بالا-چپ تیز، با گرادیان
    از سرمه‌ای تا سبز نعنایی و یک تیک سفید در میان.

    به‌صورت SVG درون‌خطی نگه داشته شده تا در هر اندازه‌ای تیز بماند و در
    حالت تاریک هم رنگ‌هایش دست‌نخورده باقی بماند.
  -->
  <defs>
